name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest
      - name: Import check
        run: uv run python -c "import sentinel; print(sentinel.__version__)"
      - name: CLI smoke
        run: |
          uv run sentinel pack list
          uv run sentinel import openapi tests/fixtures/openapi-catalogue.json --out /tmp/imported.yaml
          uv run sentinel baseline set --config examples/llm-prices.yaml openrouter-models
          uv run sentinel check --config examples/llm-prices.yaml
          uv run sentinel preflight --config examples/llm-prices.yaml --no-sem
